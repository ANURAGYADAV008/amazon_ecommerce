services:

  ecommerceqdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce-qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ecommerceapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    command: >
      uv run uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      QDRANT_URL: http://ecommerceqdrant:6333
      DB_URI: postgresql://user:password@ecommerce_postgres:5432/ecommerce
    ports:
      - "8002:8000"
    depends_on:
      ecommerceqdrant:
        condition: service_healthy
      ecommerce_postgres:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv

  ecommercestreamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-ui
    restart: unless-stopped
    command: >
      uv run streamlit run streamlit_app/chatbot.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      API_URL: http://ecommerceapi:8000
    ports:
      - "8502:8501"
    depends_on:
      - ecommerceapi
    volumes:
      - .:/app
      - /app/.venv

  ecommerce_postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_data:
