version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-api
    restart: unless-stopped

    command: >
      uv run uvicorn api.app:app
      --host 0.0.0.0
      --port 8000
      --reload

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333

    ports:
      - "8000:8000"

    depends_on:
      qdrant:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/.venv

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-ui
    restart: unless-stopped

    command: >
      uv run streamlit run streamlit_app/chatbot.py
      --server.address=0.0.0.0
      --server.port=8501

    env_file:
      - .env

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api

    volumes:
      - .:/app

volumes:
  qdrant_storage: